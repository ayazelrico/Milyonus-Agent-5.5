[project]
name = "milyonus-agent"
version = "5.5.0"
description = "Milyonus Agent — a self-improving autonomous agent that remembers, verifies, and evolves."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Milyonus" }]
keywords = ["agent", "llm", "autonomous", "memory", "skills", "telegram", "whatsapp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "httpx>=0.27",
  "typer>=0.12",
  "platformdirs>=4.2",
  "tomlkit>=0.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
discord = ["websockets>=12.0"]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
vec = ["sqlite-vec>=0.1.1"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
milyonus = "milyonus.cli.app:main"
mil = "milyonus.cli.app:main"

[project.urls]
Homepage = "https://github.com/milyonus/milyonus-agent"
Documentation = "https://github.com/milyonus/milyonus-agent#readme"
Repository = "https://github.com/milyonus/milyonus-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milyonus"]
artifacts = ["src/milyonus/_bundled_skills/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["milyonus"]
ignore_missing_imports = true
