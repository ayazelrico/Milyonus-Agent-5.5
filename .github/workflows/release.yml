name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # for PyPI Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # PyPI publish via Trusted Publishing (configure the publisher on PyPI).
      # - name: Publish to PyPI
      #   run: uv publish

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image (push requires registry creds)
        run: docker build -f deploy/Dockerfile -t milyonus/agent:${{ github.ref_name }} .
      # - name: Push
      #   run: |
      #     echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u milyonus --password-stdin
      #     docker push milyonus/agent:${{ github.ref_name }}
