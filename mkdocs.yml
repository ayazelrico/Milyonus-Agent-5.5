site_name: Milyonus Agent
site_description: An open-source, self-improving agent that remembers, verifies, and evolves.
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
  - Evaluation: evaluation.md
  - Proactivity: proactivity.md
  - Comparison: comparison.md
  - WhatsApp: whatsapp.md
  - Editor (ACP): acp.md
  - Docker: docker.md
  - Production: production.md
  - Publishing: publishing.md
  - Architecture Decisions: adr/README.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
